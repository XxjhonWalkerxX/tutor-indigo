<%!
from django.utils.translation import gettext as _
%>

% if show_upsell:
    <p>
        ${_("Don't miss the opportunity to highlight your new knowledge and skills by earning a verified certificate. Upgrade by {}.").format(user_schedule_upgrade_deadline_time)}
    </p>
    <p>
        <a href="${ace.with_link_tracking(upsell_link)}"
           style="
            color: #1e8142;
            text-decoration: none;
            border-radius: 4px;
            -webkit-border-radius: 4px;
            -moz-border-radius: 4px;
            background-color: #FFFFFF;
            border: 3px solid #1e8142;
            display: inline-block;
            padding: 8px 65px;
            ">
            <font color="#1e8142"><b>${_("Upgrade Now")}</b></font>
        </a>
    </p>
% endif
