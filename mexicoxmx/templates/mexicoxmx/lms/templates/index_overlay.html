<%namespace name='static' file='static_content.html'/>

<style>
    .logo-text-wrapper {
        display: flex;
        align-items: center; /* Centra verticalmente ambos elementos */
        justify-content: center;
        gap: 15px;
        padding: 20px 10px;
    }

    .logo-image {
        height: 88px;
        width: auto;
    }

    .vertical-divider {
        width: 1px;
        height: 60%;
        background-color: #999;
    }

    .logo-text {
        font-size: 18px;
        color: #333;
        margin: 0;
        white-space: nowrap;
    }

    @media (max-width: 768px) {
        .logo-image {
            height: 48px;
        }
        .logo-text-wrapper {
            flex-direction: column;
            gap: 10px;
        }
        .vertical-divider {
            display: none;
        }
        .logo-text {
            font-size: 15px;
            text-align: center;
        }
    }
</style>

<div class="logo-text-wrapper">
    <img src="${static.url('images/Logo_ap_2.png')}" class="logo-image" alt="Logo MexicoX">
    <div class="vertical-divider"></div>
    <p class="logo-text">La plataforma de cursos en línea de la Dirección General @prende.mx</p>
</div>
