<%namespace name='static' file='static_content.html'/>

<style>
    .logo-text-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 0;
        flex-wrap: nowrap;
    }

    .logo-img {
        height: 50px;
        width: auto;
        display: block;
    }

    .divider {
        height: 40px;
        width: 3px;
        background-color: #C9A06C;
        flex-shrink: 0;
    }

    .logo-description {
        font-size: 16px;
        color: #FFFFFF;
        margin: 0;
        line-height: 1.2;
        white-space: nowrap;
    }

    @media (max-width: 768px) {
        .logo-text-container {
            flex-direction: column;
            gap: 10px;
            flex-wrap: wrap;
        }
        .logo-img {
            height: 40px;
        }
        .divider {
            display: none;
        }
        .logo-description {
            font-size: 14px;
            text-align: center;
            white-space: normal;
        }
    }
</style>

<div class="logo-text-container">
    <img src="${static.url("images/logo_a.png")}" class="logo-img" alt="Logo Aprende.mx" />
    <div class="divider"></div>
    <p class="logo-description">La plataforma de cursos en línea de la Secretaría de Educación Pública</p>
</div>
