<%namespace name='static' file='static_content.html'/>

<style>
    .logo-text-container {
        display: flex;
        align-items: center; /* Alineación vertical */
        justify-content: center; /* Centrado horizontal */
        gap: 30px;
        padding: 20px;
        flex-wrap: wrap;
    }

    .logo-img {
        height: 75px;
        width: auto;
        max-width: 100%;
        display: block;
    }

    .divider {
        height: 50px;
        width: 4px;
        background-color: #C9A06C;
    }

    .logo-description {
        font-size: 18px;
        color: #FFFFFF;
        margin: 0;
        line-height: 1.3;
        max-width: 400px;
    }

    @media (max-width: 768px) {
        .logo-text-container {
            flex-direction: column;
            gap: 10px;
        }
        .logo-img {
            height: 75px;
        }
        .divider {
            display: none;
        }
        .logo-description {
            font-size: 16px;
            text-align: center;
        }
    }
</style>

<div class="logo-text-container">
    <img src="${static.url("images/logo_a.png")}" class="logo-img" alt="Logo Aprende.mx" />
    <div class="divider"></div>
    <p class="logo-description">
        La plataforma de cursos en línea de la Secretaría de Educación Pública
    </p>
</div>
