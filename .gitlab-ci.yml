variables:
    TUTOR_PLUGIN: mexicoxmx
    TUTOR_EXTRA_ENABLED_PLUGINS: mfe
    TUTOR_PYPI_PACKAGE: mexicoxmx
    TUTOR_IMAGES: openedx mfe
    GITHUB_REPO: mexicox/tutor-indigo

stages:
  - build
  - deploy
deploy_prod:
  stage: deploy
  script:
    - source /opt/mexicox/venv/bin/activate
    - rm -rf  "$(tutor config printroot)/env/build/openedx/themes/mexicoxmx/*"
    - cp -rf * "$(tutor config printroot)/env/build/openedx/themes/mexicoxmx"
    - cd "$(tutor config printroot)/env/build/openedx/themes"
    - pip install -e ./mexicoxmx
    - tutor plugins enable mexicoxmx
  tags:
    - edx
  only:
    refs:
      - master

deploy_dev:
  stage: deploy
  script:
    - source /opt/mexicox/venv/bin/activate
    - rm -rf  "$(tutor config printroot)/env/build/openedx/themes/mexicoxmx/*"
    - cp -rf * "$(tutor config printroot)/env/build/openedx/themes/mexicoxmx"
    - cd "$(tutor config printroot)/env/build/openedx/themes"
    - pip install -e ./mexicoxmx
    - tutor plugins enable mexicoxmx
    - tutor config save
    - tutor local do settheme mexicoxmx
    - tutor images build --build-arg EDX_PLATFORM_REPOSITORY=https://github.com/XxjhonWalkerxX/edx-platform.git --build-arg EDX_PLATFORM_VERSION=diegod  openedx
    - tutor local stop 
    - tutor local start -d
  tags:
    - develop
  only:
    refs:
      - develop  
