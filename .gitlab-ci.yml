variables:
    TUTOR_PLUGIN: mexicoxmx
    TUTOR_EXTRA_ENABLED_PLUGINS: mfe
    TUTOR_PYPI_PACKAGE: tutor-mexicoxmx
    TUTOR_IMAGES: openedx mfe
    GITHUB_REPO: overhangio/tutor-mexicoxmx

stages:
  - build
  - deploy


deploy_prod:
  stage: deploy
  script:
    - sudo cp -r * $TUTOR_DIR/mexicoxmx
    - source $TUTOR_DIR/venv/bin/activate
    - cd $TUTOR_DIR
    - sudo pip install -e ./mexicoxmx
    - sudo tutor plugins enable mexicoxmx
    - sudo tutor local do settheme mexicoxmx
    - sudo tutor config save
    - sudo tutor images build openedx
    - sudo tutor local start -d
  tags:
    - edx
  only:
    refs:
      - master
