variables:
    TUTOR_PLUGIN: indigo
    TUTOR_EXTRA_ENABLED_PLUGINS: mfe
    TUTOR_PYPI_PACKAGE: tutor-indigo
    TUTOR_IMAGES: openedx mfe
    GITHUB_REPO: overhangio/tutor-indigo

include:
  - project: 'community/tutor-ci'
    file: 'plugin-gitlab-ci.yml'

stages:
  - deploy
deploy_prod:
  stage: deploy
  needs:
    - job: build_prod
  script:
    - cp -r * $TUTOR_DIR/tutor-indigo
    - source $TUTOR_DIR/venv/bin/activate
    - cd $TUTOR_DIR
    - pip install -e ./tutor-indigo
    - tutor plugins enable indigo
  tags:
    - production
  only:
    refs:
      - master

